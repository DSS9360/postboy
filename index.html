                        <div class="collection-item" onclick="loadRequest(${JSON.stringify(request).replace(/"/g, '&quot;')})" oncontextmenu="showContextMenu(event, 'request', ${collection.id}, '${request.name}')">
                            <span class="method-badge ${request.method}">${request.method}</span>
                            <span class="item-url">${escapeHtml(request.name || shortUrl)}</span>
                        </div>
                    `;
                });
                
                html += '</div>';
            });
            
            list.innerHTML = html;
        }
        
        function toggleCollectionFolder(element) {
            const requests = element.nextElementSibling;
            requests.classList.toggle('expanded');
        }
        
        function addRequestToCollection(collectionId) {
            openNewCollectionModal(collectionId);
        }
        
        function saveToCollection() {
            openNewCollectionModal();
        }
        
        function loadRequest(request) {
            // Method
            document.getElementById('method-select').value = request.method || 'GET';
            
            // URL
            document.getElementById('url-input').value = request.url || '';
            
            // Headers
            const headersTbody = document.getElementById('headers-tbody');
            headersTbody.innerHTML = '';
            if (request.headers && request.headers.length > 0) {
                request.headers.forEach(h => {
                    const row = createKVRow('header');
                    const inputs = row.querySelectorAll('input[type="text"]');
                    inputs[0].value = h.key || '';
                    inputs[1].value = h.value || '';
                    row.querySelector('input[type="checkbox"]').checked = h.enabled !== false;
                    headersTbody.appendChild(row);
                });
            } else {
                addHeader();
            }
            updateBadgeCount('headers');
            
            // Params
            const paramsTbody = document.getElementById('params-tbody');
            paramsTbody.innerHTML = '';
            if (request.params && request.params.length > 0) {
                request.params.forEach(p => {
                    const row = createKVRow('param');
                    const inputs = row.querySelectorAll('input[type="text"]');
                    inputs[0].value = p.key || '';
                    inputs[1].value = p.value || '';
                    row.querySelector('input[type="checkbox"]').checked = p.enabled !== false;
                    paramsTbody.appendChild(row);
                });
            } else {
                addParam();
            }
            updateBadgeCount('params');
            
            // Body
            if (request.body) {
                document.querySelector(`input[name="body-type"][value="${request.body.type || 'none'}"]`).checked = true;
                document.querySelectorAll('.body-type-option').forEach(opt => {
                    opt.classList.toggle('selected', opt.querySelector('input').value === (request.body.type || 'none'));
                });
                showBodyType(request.body.type || 'none');
                
                if (request.body.type === 'json' && request.body.content) {
                    document.getElementById('body-json-editor').value = request.body.content;
                } else if (request.body.type === 'raw' && request.body.content) {
                    document.getElementById('body-raw-editor').value = request.body.content;
                }
            }
            
            // Scroll to top
            window.scrollTo(0, 0);
        }
        
        function buildCurrentRequest() {
            return {
                id: Date.now(),
                method: document.getElementById('method-select').value,
                url: document.getElementById('url-input').value,
                headers: Array.from(document.getElementById('headers-tbody').querySelectorAll('tr')).map(row => ({
                    key: row.querySelectorAll('input[type="text"]')[0]?.value || '',
                    value: row.querySelectorAll('input[type="text"]')[1]?.value || '',
                    enabled: row.querySelector('input[type="checkbox"]')?.checked
                })),
                params: Array.from(document.getElementById('params-tbody').querySelectorAll('tr')).map(row => ({
                    key: row.querySelectorAll('input[type="text"]')[0]?.value || '',
                    value: row.querySelectorAll('input[type="text"]')[1]?.value || '',
                    enabled: row.querySelector('input[type="checkbox"]')?.checked
                })),
                body: {
                    type: document.querySelector('input[name="body-type"]:checked')?.value || 'none',
                    content: document.getElementById('body-json-editor')?.value || ''
                }
            };
        }
        
        /* ========== Context Menu ========== */
        function showContextMenu(event, type, id, requestName = null) {
            event.preventDefault();
            event.stopPropagation();
            
            state.contextType = type;
            state.contextItem = { id, requestName };
            
            const menu = document.getElementById('context-menu');
            menu.style.left = event.pageX + 'px';
            menu.style.top = event.pageY + 'px';
            menu.classList.add('active');
        }
        
        function contextMenuAction(action) {
            const { id, requestName } = state.contextItem;
            
            if (state.contextType === 'history') {
                const item = state.history.find(h => h.id === id);
                if (action === 'load') {
                    loadFromHistory(id);
                } else if (action === 'delete') {
                    state.history = state.history.filter(h => h.id !== id);
                    saveToStorage();
                    renderHistory();
                } else if (action === 'duplicate') {
                    openNewCollectionModal();
                }
            } else if (state.contextType === 'request') {
                const collection = state.collections.find(c => c.id === id);
                if (collection) {
                    const request = collection.requests.find(r => r.name === requestName);
                    if (action === 'load' && request) {
                        loadRequest(request);
                    } else if (action === 'delete' && request) {
                        collection.requests = collection.requests.filter(r => r.name !== requestName);
                        saveToStorage();
                        renderCollections();
                    } else if (action === 'rename') {
                        const newName = prompt('输入新名称:', requestName);
                        if (newName && request) {
                            request.name = newName;
                            saveToStorage();
                            renderCollections();
                        }
                    } else if (action === 'duplicate' && request) {
                        const newRequest = { ...request, id: Date.now(), name: request.name + ' (副本)' };
                        collection.requests.push(newRequest);
                        saveToStorage();
                        renderCollections();
                    }
                }
            }
            
            document.getElementById('context-menu').classList.remove('active');
        }
        
        /* ========== Import/Export ========== */
        function exportCollections() {
            const data = {
                collections: state.collections,
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `api-collections-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function importCollections(input) {
            if (input.files.length === 0) return;
            
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.collections) {
                        state.collections = [...state.collections, ...data.collections];
                    }
                    
                    saveToStorage();
                    renderCollections();
                    alert('导入成功');
                } catch (err) {
                    alert('导入失败：无效的 JSON 文件');
                }
            };
            
            reader.readAsText(file);
            input.value = '';
        }
        
        /* ========== Settings ========== */
        function openSettingsModal() {
            openModal('settings-modal');
        }
        
        /* ========== Modal Helpers ========== */
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        /* ========== Utility Functions ========== */
        function formatTime(date) {
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
            
            return date.toLocaleDateString('zh-CN');
        }
        
        function truncateUrl(url) {
            if (!url) return '';
            try {
                const urlObj = new URL(url);
                const path = urlObj.pathname + urlObj.search;
                return urlObj.hostname + (path.length > 30 ? path.slice(0, 30) + '...' : path);
            } catch (e) {
                return url.length > 40 ? url.slice(0, 40) + '...' : url;
            }
        }
    </script>
